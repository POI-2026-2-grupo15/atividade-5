# CPU-bound: API stateless de hashing. Deployment com 2 réplicas: o Service
# distribui as requisições entre os pods e o trabalho de CPU é dividido entre eles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-bound
  namespace: atividade5
  labels: {app: cpu-bound}
spec:
  replicas: 2
  selector:
    matchLabels: {app: cpu-bound}
  template:
    metadata:
      labels: {app: cpu-bound}
    spec:
      containers:
        - name: cpu-bound
          image: docker.io/arthurgb469/cpu-bound:atividade-4
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 500m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-bound
  namespace: atividade5
spec:
  type: NodePort
  selector: {app: cpu-bound}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30001
