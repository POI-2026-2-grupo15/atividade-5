# Memory-bound: consolida CSVs em memória. Stateless, mas cada requisição pode
# ocupar bastante RAM: 1 réplica com limite de memória maior (2Gi), para não
# disputar a memória do nó com várias cópias. A API não tem /health; as probes usam /docs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-bound
  namespace: atividade5
  labels: {app: memory-bound}
spec:
  replicas: 1
  selector:
    matchLabels: {app: memory-bound}
  template:
    metadata:
      labels: {app: memory-bound}
    spec:
      containers:
        - name: memory-bound
          image: docker.io/victorxluna/memory-bound:atv4
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /docs, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /docs, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: memory-bound
  namespace: atividade5
spec:
  type: NodePort
  selector: {app: memory-bound}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30003
