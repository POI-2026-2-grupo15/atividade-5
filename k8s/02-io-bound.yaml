# IO-bound: grava e lê arquivos em /data. Os dados precisam de um disco real
# (não a camada gravável do container nem tmpfs), por isso um PersistentVolumeClaim.
# O PVC é ReadWriteOnce: Deployment com 1 réplica e estratégia Recreate, para o
# pod antigo liberar o volume antes do novo subir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: io-bound-data
  namespace: atividade5
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-bound
  namespace: atividade5
  labels: {app: io-bound}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: io-bound}
  template:
    metadata:
      labels: {app: io-bound}
    spec:
      containers:
        - name: io-bound
          image: docker.io/arthurgb469/io-bound:atividade-4
          env:
            - name: IO_DATA_DIR
              value: /data
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: io-bound-data
---
apiVersion: v1
kind: Service
metadata:
  name: io-bound
  namespace: atividade5
spec:
  type: NodePort
  selector: {app: io-bound}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30002
