# Exposição da memory-bound: Service NodePort com porta fixa, destino do member no load balancer.
apiVersion: v1
kind: Service
metadata:
  name: memory-bound
  namespace: atividade5
spec:
  type: NodePort
  selector: {app: memory-bound}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30003
